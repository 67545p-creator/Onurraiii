<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Onur AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171a23;
      border-bottom: 1px solid #292d38;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .ai {
      align-self: flex-start;
      background: #242936;
      border-bottom-left-radius: 4px;
    }

    #inputArea {
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #171a23;
      border-top: 1px solid #292d38;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 15px;
      border: 0;
      outline: none;
      border-radius: 12px;
      background: #242936;
      color: white;
      font-size: 16px;
    }

    #messageInput::placeholder {
      color: #888;
    }

    #sendButton {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 88%;
      }

      #sendButton {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <header>Onur AI</header>

  <main id="chat"></main>

  <div id="inputArea">
    <input
      id="messageInput"
      type="text"
      autocomplete="off"
    >

    <button id="sendButton">Gönder</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.classList.add("message", type);
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || button.disabled) {
        return;
      }

      addMessage(text, "user");

      input.value = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Sunucu hatası");
        }

        addMessage(data.reply, "ai");

      } catch (error) {
        console.error(error);
        addMessage("Bir hata oluştu.", "ai");
      }

      button.disabled = false;
      input.focus();
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
