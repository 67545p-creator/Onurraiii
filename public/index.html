<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onur AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: #171a23;
      border-bottom: 1px solid #292d38;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
    }

    .ai {
      align-self: flex-start;
      background: #242936;
    }

    #inputArea {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #171a23;
      border-top: 1px solid #292d38;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #242936;
      color: white;
      font-size: 16px;
    }

    #sendButton {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <header>Onur AI</header>

  <div id="chat"></div>

  <div id="inputArea">
    <input
      id="messageInput"
      type="text"
      placeholder=""
      autocomplete="off"
    >

    <button id="sendButton">Gönder</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) {
        return;
      }

      addMessage(text, "user");

      input.value = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Sunucu hatası");
        }

        addMessage(data.reply, "ai");

      } catch (error) {
        addMessage("Bir hata oluştu.", "ai");
        console.error(error);
      }

      button.disabled = false;
      input.focus();
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
